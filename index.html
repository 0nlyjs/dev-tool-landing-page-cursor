<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>cursor</title>
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="nav-left">
          <img class="logo" src="assets/logo.svg" alt="logo" />
        </div>

        <div class="nav-centre">
          <a href="#">Product</a>
          <a href="#">Enterprise</a>
          <a href="#">Pricing</a>
          <a href="#">Resources</a>
        </div>
        <div class="nav-right">
          <button class="btn btn-sign-in">Sign in</button>
          <button class="btn btn-download">Download</button>
        </div>
      </nav>
    </header>
    <main>
      <section class="hero-section">
        <h1>
          Built to make you extraordinarily productive. <br />
          Cursor is the best way to code with AI.
        </h1>

        <button class="btn btn-hero-section">Download for macOS ↓</button>
        <img class="hero-image" src="assets/one.jpg" alt="cursor app" />
      </section>
      <section class="trusted-by-section">
        <h3>Trusted every day by teams that build world-class software</h3>
        <div class="tb-logos-grid">
          <div class="tb-logo-item">
            <img
              src="assets/brand-stripe.svg"
              alt="brand-stripe"
              class="tb-company-logos"
            />
          </div>
          <div class="tb-logo-item">
            <img
              src="assets/brand-openai.svg"
              alt="brand-openai"
              class="tb-company-logos"
            />
          </div>
          <div class="tb-logo-item">
            <img
              src="assets/brand-linear.svg"
              alt="brand-linear"
              class="tb-company-logos"
            />
          </div>
          <div class="tb-logo-item">
            <img
              src="assets/brand-datadog.svg"
              alt="brand-datadog"
              class="tb-company-logos"
            />
          </div>
          <div class="tb-logo-item">
            <img
              src="assets/brand-nvidia.svg"
              alt="brand-nvidia"
              class="tb-company-logos"
            />
          </div>
          <div class="tb-logo-item">
            <img
              src="assets/brand-figma.svg"
              alt="brand-figma"
              class="tb-company-logos"
            />
          </div>
          <div class="tb-logo-item">
            <img
              src="assets/brand-ramp.svg"
              alt="brand-ramp"
              class="tb-company-logos"
            />
          </div>
          <div class="tb-logo-item">
            <img
              src="assets/brand-adobe.svg"
              alt="brand-adobe"
              class="tb-company-logos"
            />
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
